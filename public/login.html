<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Entrar · IBGE AC-TI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0d12;
      --card: #121924;
      --text: #ebe6dc;
      --muted: #8a8478;
      --brass: #c9a227;
      --brass-dim: #8f7420;
      --line: #2a3342;
      --coral: #d97b6c;
      --ink: #0a0d12;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(800px 420px at 10% -8%, rgba(201, 162, 39, 0.1), transparent 55%),
        radial-gradient(600px 360px at 100% 0%, rgba(63, 154, 120, 0.06), transparent 50%),
        var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 1.25rem;
    }
    .card {
      width: min(400px, 100%);
      background: linear-gradient(165deg, rgba(28, 36, 48, 0.55), var(--card));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.7rem 1.45rem 1.4rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      animation: enter 240ms var(--ease);
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
    .brand {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 0.25rem;
    }
    .brand span { color: var(--brass); font-style: italic; font-weight: 500; }
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brass);
      margin: 0.7rem 0 0.35rem;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-size: 1.4rem;
      margin: 0 0 0.4rem;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); font-size: 0.92rem; margin: 0 0 1.15rem; line-height: 1.45; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.35rem; font-weight: 600; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 0.72rem 0.85rem; border-radius: 10px;
      border: 1px solid var(--line); background: #0e1520; color: var(--text);
      font: inherit; margin-bottom: 0.85rem;
      transition: border-color 160ms var(--ease);
    }
    input:focus { outline: none; border-color: var(--brass-dim); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--brass); }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: 0.75rem 1rem;
      font: inherit; font-weight: 700; cursor: pointer; min-height: 46px;
      background: var(--brass); color: var(--ink);
      box-shadow: 0 2px 0 var(--brass-dim);
      transition: transform 100ms var(--ease), filter 160ms var(--ease);
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .err {
      display: none; background: rgba(217, 123, 108, 0.12);
      border: 1px solid #6a3a34; color: #ffc9cd;
      padding: 0.55rem 0.7rem; border-radius: 8px; font-size: 0.86rem; margin-bottom: 0.8rem;
    }
    .err.show { display: block; }
    .foot { margin-top: 1rem; font-size: 0.74rem; color: var(--muted); text-align: center; }
    .row { display: flex; align-items: center; gap: 0.45rem; margin: -0.25rem 0 0.9rem; }
    .row input { width: auto; margin: 0; }
    .row label { margin: 0; color: var(--text); font-size: 0.85rem; font-weight: 500; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">IBGE <span>AC-TI</span></div>
    <div class="eyebrow">Acesso restrito</div>
    <h1>Área de estudo</h1>
    <p>Entre com a senha para continuar — aulas, quizzes e PDFs ficam atrás desta porta.</p>
    <div class="err" id="err" role="alert"></div>
    <form id="form" autocomplete="current-password">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required autofocus
             autocomplete="current-password" placeholder="••••••••" />
      <div class="row">
        <input type="checkbox" id="show" />
        <label for="show">Mostrar senha</label>
      </div>
      <button type="submit" id="btn">Entrar</button>
    </form>
    <div class="foot">Sessão de 30 dias neste navegador · HTTPS</div>
  </main>
  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("btn");
    const pwd = document.getElementById("password");
    document.getElementById("show").addEventListener("change", (e) => {
      pwd.type = e.target.checked ? "text" : "password";
    });
    fetch("/api/auth/me", { credentials: "include", cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && d.authenticated) location.replace("/"); })
      .catch(() => {});
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "Entrando…";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pwd.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = data.error || "Não foi possível entrar.";
          err.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Entrar";
          return;
        }
        const next = new URLSearchParams(location.search).get("next") || "/";
        location.replace(next.startsWith("/") ? next : "/");
      } catch {
        err.textContent = "Erro de rede. Tente de novo.";
        err.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
